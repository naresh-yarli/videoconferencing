        <label for="streamId"
          >Stream ID (this becomes the 'roomId' URL parameter):</label

        <label for="displayName">Your Display Name (in conference):</label>
        <input type="text" id="displayName" value="TestUser" />
      </div>

      <button onclick="launchConference()">
        Construct URL & Launch Conference
      </button>

      <div id="errorMessage" class="error"></div>
      <div id="infoMessage" class="info" style="display: none"></div>
    </div>

    <script>
      function launchConference() {
        const backendApiUrl = document
          .getElementById("backendApiUrl")
          .value.trim();
        const uiAuthToken = document.getElementById("uiAuthToken").value.trim(); // This is the token for WebRTCService
        const streamId = document.getElementById("streamId").value.trim(); // This is the roomId for the UI
        const displayName = document.getElementById("displayName").value.trim();
        const conferenceAppUrl = "http://localhost:3001/"; // URL of your main video conferencing React app

        const errorDiv = document.getElementById("errorMessage");
        const infoDiv = document.getElementById("infoMessage");
        errorDiv.textContent = "";
        infoDiv.style.display = "none";
        infoDiv.textContent = "";

        if (!backendApiUrl || !uiAuthToken || !streamId || !displayName) {
          errorDiv.textContent = "Please fill in all fields.";
          return;
        }

        infoDiv.textContent = `Constructing URL...`;
        infoDiv.style.display = "block";

        try {
          const params = new URLSearchParams();
          params.append("apiUrl", backendApiUrl); // For WebRTCService to know where to make API calls
          params.append("apiKey", uiAuthToken); // This is the AuthToken WebRTCService will use
          params.append("roomId", streamId); // This is the Stream/Room ID
          params.append("displayName", displayName);

          const finalUrl = `${conferenceAppUrl}?${params.toString()}`;
          infoDiv.textContent += `\nRedirecting to: ${finalUrl.replace(
            uiAuthToken,
            "[REDACTED_TOKEN]"
          )}`;

          // Redirect
          window.location.href = finalUrl;
        } catch (error) {
          console.error("Error constructing URL:", error);
          errorDiv.textContent = `Error: ${error.message}`;
          infoDiv.style.display = "none";
        }
      }
    </script>
